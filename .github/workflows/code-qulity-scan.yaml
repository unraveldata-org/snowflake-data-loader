name: code-qulity-scan
permissions:
  contents: read
on:
  workflow_dispatch:

jobs:
  sonar-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarScanner via Docker
        run: |
          docker run --rm \
            -e SONAR_HOST_URL="http://23.21.77.89:9000" \
            -e SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}" \
            -v "${{ github.workspace }}:/usr/src" \
            sonarsource/sonar-scanner-cli:4.7 \
            -Dsonar.projectKey=snowflake-data-loader \
            -Dsonar.sources=. \
            -Dsonar.login="${{ secrets.SONAR_TOKEN }}"

