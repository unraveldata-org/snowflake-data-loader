name: release-pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.17)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Extract version
        id: vars
        run: |
          VERSION_INPUT="${{ github.event.inputs.version }}"
          VERSION="${VERSION_INPUT#v}"   # Remove leading v if exists
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION"

      - name: Update VERSION file
        run: |
          echo "${{ env.VERSION }}" > VERSION
          cat VERSION

      - name: Git release branch and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b release/v${{ env.VERSION }}
          git add VERSION
          git commit -m "chore(release): set version to ${{ env.VERSION }}"
          git push origin release/v${{ env.VERSION }}
